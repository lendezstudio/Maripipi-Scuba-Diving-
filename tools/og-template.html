<!doctype html>
<!-- Source for assets/img/og/maripipi-scuba-diving-og.jpg (rendered at 1200x630 by tools/build-og.ps1). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-latin-var.woff2") format("woff2"); font-weight: 800 900; font-stretch: 125%; }
  @font-face { font-family: "Manrope"; src: url("../assets/fonts/manrope-var.woff2") format("woff2"); font-weight: 200 800; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #05090F; }
  .og { position: relative; width: 1200px; height: 630px; color: #F1F5F8; font-family: "Manrope", sans-serif; }
  .og > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  /* Navy multiply keeps the light shaft blue instead of greying it out. */
  .og::before { content: ""; position: absolute; inset: 0; background: #1F5F8C; mix-blend-mode: multiply; }
  .og::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(5,9,15,0.9) 0%, rgba(5,9,15,0.7) 38%, rgba(8,47,79,0.2) 66%, rgba(8,47,79,0) 100%),
      linear-gradient(0deg, rgba(5,9,15,0.55), rgba(5,9,15,0) 45%);
  }
  .og::before, .og::after { z-index: 0; }
  .content { position: absolute; z-index: 1; left: 76px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 132px; height: 132px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(241,245,248,0.35); margin-bottom: 40px; }
  h1 { margin: 0; font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 900; font-size: 70px; line-height: 0.95; letter-spacing: -0.01em; text-transform: uppercase; }
  .loc { margin: 26px 0 0; font-weight: 700; font-size: 20px; letter-spacing: 0.28em; color: #A6C5DB; }
  .line { margin: 14px 0 0; font-size: 22px; font-weight: 500; color: #F1F5F8; display: flex; align-items: center; gap: 16px; }
  .line::before { content: ""; width: 40px; height: 1.5px; background: #246994; }
</style>
</head>
<body>
  <div class="og">
    <img src="../assets/img/hero-diver-wide-1600.jpg" alt="">
    <div class="content">
      <img class="logo" src="../assets/img/logo-badge-360.png" alt="">
      <h1>Maripipi<br>Scuba Diving</h1>
      <p class="loc">MARIPIPI, BILIRAN · PHILIPPINES</p>
      <p class="line">A different world below.</p>
    </div>
  </div>
</body>
</html>
